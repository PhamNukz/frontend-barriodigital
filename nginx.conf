server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los bundles llevan hash de contenido en el nombre (main-ABC123.js): el nombre
  # cambia en cada build, asi que se pueden cachear para siempre sin riesgo.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    # Sin "expires": nginx generaria su propio Cache-Control y saldria duplicado.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html NO se cachea: es quien apunta a los bundles hasheados, y si el
  # navegador se lo queda, un despliegue nuevo queda invisible hasta un Ctrl+F5
  # (paso de verdad: la UI seguia corriendo un bundle viejo tras desplegar).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # SPA: cualquier ruta de Angular vuelve a index.html
  location / { try_files $uri $uri/ /index.html; }
}
